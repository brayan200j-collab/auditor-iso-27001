name: auditor-virtual

# Local stack = Supabase local (started with `pnpm exec supabase start`, see Makefile) + this API.
# The API joins the Supabase Docker network so it can reach Postgres, Auth (JWKS) and Storage.
# Values come from the root `.env`, generated by `scripts/dev-env.sh` (never committed).

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: ${DATABASE_URL:?run make env}
  TEST_DATABASE_URL: ${TEST_DATABASE_URL:?run make env}
  SUPABASE_URL: ${SUPABASE_INTERNAL_URL:?run make env}
  SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:?run make env}
  SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?run make env}
  SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?run make env}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
  PROMPTS_DIR: /workspace/prompts
  SEEDS_DIR: /workspace/seeds
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  SEED_REVIEWER_EMAIL: ${SEED_REVIEWER_EMAIL:-}
  SEED_REVIEWER_PASSWORD: ${SEED_REVIEWER_PASSWORD:-}
  SEED_SME_EMAIL: ${SEED_SME_EMAIL:-}
  SEED_SME_PASSWORD: ${SEED_SME_PASSWORD:-}
  SEED_SME_B_EMAIL: ${SEED_SME_B_EMAIL:-}
  SEED_SME_B_PASSWORD: ${SEED_SME_B_PASSWORD:-}
  SEED_MENTOR_EMAIL: ${SEED_MENTOR_EMAIL:-}
  SEED_MENTOR_PASSWORD: ${SEED_MENTOR_PASSWORD:-}

x-api-common: &api-common
  image: auditor-api-dev:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: dev
  working_dir: /workspace/apps/api
  environment:
    <<: *api-env
  volumes:
    - .:/workspace
    - api-venv:/opt/venv
    - uv-cache:/root/.cache/uv
  networks:
    - supabase

services:
  # One-off commands: lint, type-check, tests, migrations, seeds.
  api-dev:
    <<: *api-common
    profiles: ["tools"]

  api:
    <<: *api-common
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn auditor.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 40

networks:
  supabase:
    external: true
    name: supabase_network_pagina_web_iso27001

volumes:
  api-venv:
  uv-cache:
