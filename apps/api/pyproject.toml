[project]
name = "auditor-api"
version = "0.1.0"
description = "Auditor Virtual ISO/IEC 27001 con IA - API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "alembic",
    "psycopg[binary]",
    "pyjwt[crypto]",
    "structlog",
    "httpx",
    "pymupdf",
    "jinja2",
    "weasyprint",
    "slowapi",
    "python-multipart",
    "pyyaml",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "import-linter",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "schemathesis",
    "bandit",
    "pip-audit",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RET", "PTH", "ASYNC", "RUF", "PL", "TRY"]
ignore = [
    "PLR0913", # use cases receive explicit collaborators by constructor
    "TRY003",  # domain errors carry a Spanish user message by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "PLR0915", "S311", "PLC0415"]
"alembic/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["auditor"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*", "pymupdf", "pymupdf.*", "weasyprint", "weasyprint.*", "slowapi", "slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires the PostgreSQL test database",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::DeprecationWarning:auditor",
]

[tool.coverage.run]
source = ["auditor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
